---
name: CI

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "catalog/**"
      - "docs/**"
      - "Localization/**"
      - "build/**"
      - ".github/workflows/**"
      - "Directory.Build.*"
      - "Directory.Packages.props"
      - "global.json"
      - "NuGet.Config"
      - "README.md"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES.md"
      - "*.sln"
      - "*.slnx"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "catalog/**"
      - "docs/**"
      - "Localization/**"
      - "build/**"
      - ".github/workflows/**"
      - "Directory.Build.*"
      - "Directory.Packages.props"
      - "global.json"
      - "NuGet.Config"
      - "README.md"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES.md"
      - "*.sln"
      - "*.slnx"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-metadata:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_timestamp: ${{ steps.metadata.outputs.build_timestamp }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      make_latest: ${{ steps.metadata.outputs.make_latest }}
      release_notes_path: ${{ steps.metadata.outputs.release_notes_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version and build timestamp
        id: metadata
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?)$') {
              throw "Release tags must match vX.Y.Z or vX.Y.Z-rc.N. Received '$env:GITHUB_REF_NAME'."
            }
            $version = $Matches.version
            $isPrerelease = $version -match '-rc\.(0|[1-9][0-9]*)$'
            $releaseNotesPath = "docs/releases/$version.md"
            if (-not (Test-Path -LiteralPath $releaseNotesPath)) {
              throw "Release notes are required at '$releaseNotesPath'."
            }
          } else {
            $version = "0.1.0-ci.${{ github.run_number }}"
            $isPrerelease = $false
            $releaseNotesPath = ""
          }

          $buildTimestamp = [DateTimeOffset]::UtcNow.ToString("O")
          $makeLatest = (-not $isPrerelease).ToString().ToLowerInvariant()
          "version=$version" >> $env:GITHUB_OUTPUT
          "build_timestamp=$buildTimestamp" >> $env:GITHUB_OUTPUT
          "is_prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "make_latest=$makeLatest" >> $env:GITHUB_OUTPUT
          "release_notes_path=$releaseNotesPath" >> $env:GITHUB_OUTPUT

  integration-validation:
    name: Integration Validation
    uses: ./.github/workflows/integration.yml
    with:
      run_lightweight_docker: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      run_non_oracle_docker: false
      run_oracle: false

  package:
    name: Package ${{ matrix.runtime }}
    needs: release-metadata
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: windows-latest
            runtime: win-x64
            archive_kind: zip
            platform_test_project: tests/OpenCode.Workspace.Platform.Windows.Tests/OpenCode.Workspace.Platform.Windows.Tests.csproj
          - runs_on: ubuntu-latest
            runtime: linux-x64
            archive_kind: tar.gz
            platform_test_project: tests/OpenCode.Workspace.Platform.Linux.Tests/OpenCode.Workspace.Platform.Linux.Tests.csproj
          - runs_on: macos-15
            runtime: osx-arm64
            archive_kind: tar.gz
            platform_test_project: tests/OpenCode.Workspace.Platform.MacOS.Tests/OpenCode.Workspace.Platform.MacOS.Tests.csproj
    env:
      DOTNET_NOLOGO: true
      EnableWindowsTargeting: true
      RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
      BUILD_TIMESTAMP: ${{ needs.release-metadata.outputs.build_timestamp }}
      DIST_ROOT: artifacts/dist
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.204

      - name: Restore solution
        run: dotnet restore OpenCode.Workspace.slnx

      - name: Build solution
        run: dotnet build OpenCode.Workspace.slnx -c Release --no-restore

      - name: Run platform tests
        run: dotnet test ${{ matrix.platform_test_project }} -c Release --no-build

      - name: Run Windows ConPTY integration tests
        if: matrix.runtime == 'win-x64'
        run: >-
          dotnet test tests/OpenCode.Workspace.Api.IntegrationTests/OpenCode.Workspace.Api.IntegrationTests.csproj
          -c Release --no-build --filter "Category=WindowsConPtyIntegration"

      - name: Run Windows Oracle port conflict handling tests
        if: matrix.runtime == 'win-x64'
        run: >-
          dotnet test tests/OpenCode.Workspace.Core.Tests/OpenCode.Workspace.Core.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName=OpenCode.Workspace.Core.Tests.OraclePortConflictHandlingTests.ValidateVolatileEnvironmentAsync_UsesWslDockerForPortPreflightWhenWindowsDockerPsTimesOut|FullyQualifiedName=OpenCode.Workspace.Core.Tests.OraclePortConflictHandlingTests.ValidateVolatileEnvironmentAsync_UsesShortTimeoutForDockerPsPreflight|FullyQualifiedName=OpenCode.Workspace.Core.Tests.OraclePortConflictHandlingTests.RunSimpleDockerCommandAsync_WhenWindowsDockerUnavailableButWslDockerAvailable_ThrowsPreciseMessage"

      - name: Run focused Windows ProcessRunner tests
        if: matrix.runtime == 'win-x64'
        run: >-
          dotnet test tests/OpenCode.Workspace.Core.Tests/OpenCode.Workspace.Core.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName=OpenCode.Workspace.Core.Tests.ProcessRunnerTests.RunAsync_CapturesStdoutAndStderrLines|FullyQualifiedName=OpenCode.Workspace.Core.Tests.ProcessRunnerTests.RunAsync_ImmediateExitStillCapturesBothStreams|FullyQualifiedName=OpenCode.Workspace.Core.Tests.ProcessRunnerTests.RunAsync_LargeOutputIsFullyDrained|FullyQualifiedName=OpenCode.Workspace.Core.Tests.ProcessRunnerTests.RunAsync_CancellationDoesNotDeadlockStreamCompletion|FullyQualifiedName=OpenCode.Workspace.Core.Tests.ProcessRunnerTests.RunAsync_CancellationTerminatesDescendantProcessTree"

      - name: Publish desktop
        run: >-
          dotnet publish src/OpenCode.Workspace.Avalonia/OpenCode.Workspace.Avalonia.csproj
          -c Release -r ${{ matrix.runtime }} --self-contained true
          -p:Version=${{ env.RELEASE_VERSION }} -p:DebugSymbols=false -p:DebugType=None
          -o artifacts/publish/${{ matrix.runtime }}/desktop

      - name: Publish CLI
        run: >-
          dotnet publish src/OpenCode.Workspace.Cli/OpenCode.Workspace.Cli.csproj
          -c Release -r ${{ matrix.runtime }} --self-contained true
          -p:Version=${{ env.RELEASE_VERSION }} -p:DebugSymbols=false -p:DebugType=None
          -o artifacts/publish/${{ matrix.runtime }}/cli

      - name: Publish LocalHost
        run: >-
          dotnet publish src/OpenCode.Workspace.Api/OpenCode.Workspace.Api.csproj
          -c Release -r ${{ matrix.runtime }} --self-contained true
          -p:Version=${{ env.RELEASE_VERSION }} -p:DebugSymbols=false -p:DebugType=None
          -o artifacts/publish/${{ matrix.runtime }}/api

      - name: Publish MCP
        run: >-
          dotnet publish src/OpenCode.Workspace.Mcp/OpenCode.Workspace.Mcp.csproj
          -c Release -r ${{ matrix.runtime }} --self-contained true
          -p:Version=${{ env.RELEASE_VERSION }} -p:DebugSymbols=false -p:DebugType=None
          -o artifacts/publish/${{ matrix.runtime }}/mcp

      - name: Publish RemoteBridge
        run: >-
          dotnet publish src/OpenCode.Workspace.RemoteBridge/OpenCode.Workspace.RemoteBridge.csproj
          -c Release -r ${{ matrix.runtime }} --self-contained true
          -p:Version=${{ env.RELEASE_VERSION }} -p:DebugSymbols=false -p:DebugType=None
          -o artifacts/publish/${{ matrix.runtime }}/remote-bridge

      - name: Assemble distribution
        run: >-
          dotnet run --project tools/OpenCode.Workspace.ReleaseTool/OpenCode.Workspace.ReleaseTool.csproj --
          assemble
          --source-root .
          --output-root ${{ env.DIST_ROOT }}
          --runtime ${{ matrix.runtime }}
          --version ${{ env.RELEASE_VERSION }}
          --desktop-publish-dir artifacts/publish/${{ matrix.runtime }}/desktop
          --cli-publish-dir artifacts/publish/${{ matrix.runtime }}/cli
          --api-publish-dir artifacts/publish/${{ matrix.runtime }}/api
          --mcp-publish-dir artifacts/publish/${{ matrix.runtime }}/mcp
          --remote-bridge-publish-dir artifacts/publish/${{ matrix.runtime }}/remote-bridge
          --archive-kind ${{ matrix.archive_kind }}
          --git-commit ${{ github.sha }}
          --build-timestamp ${{ env.BUILD_TIMESTAMP }}
          --self-contained true

      - name: Verify package checksum
        shell: pwsh
        run: |
          $archiveName = "opencode-workspace-${{ env.RELEASE_VERSION }}-${{ matrix.runtime }}.${{ matrix.archive_kind }}"
          $archivePath = Join-Path "${{ env.DIST_ROOT }}" $archiveName
          $checksumPath = "$archivePath.sha256"
          $expected = ((Get-Content -LiteralPath $checksumPath -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Checksum mismatch for $archiveName. Expected $expected, got $actual."
          }

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v6
        with:
          name: opencode-workspace-${{ env.RELEASE_VERSION }}-${{ matrix.runtime }}
          path: |
            artifacts/dist/opencode-workspace-${{ env.RELEASE_VERSION }}-${{ matrix.runtime }}.${{ matrix.archive_kind }}
            artifacts/dist/opencode-workspace-${{ env.RELEASE_VERSION }}-${{ matrix.runtime }}.${{ matrix.archive_kind }}.sha256
          if-no-files-found: error

      - name: Download packaged artifact for native acceptance
        uses: actions/download-artifact@v4
        with:
          name: opencode-workspace-${{ env.RELEASE_VERSION }}-${{ matrix.runtime }}
          path: artifacts/downloaded/${{ matrix.runtime }}

      - name: Validate complete extracted distribution on native runner
        env:
          OPENCODE_EXISTING_PACKAGE_ARCHIVE: ${{ github.workspace }}/artifacts/downloaded/${{ matrix.runtime }}/opencode-workspace-${{ env.RELEASE_VERSION }}-${{ matrix.runtime }}.${{ matrix.archive_kind }}
          OPENCODE_PACKAGE_TEST_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/native-package-validation/${{ matrix.runtime }}
        run: >-
          dotnet test tests/OpenCode.Workspace.Mcp.Tests/OpenCode.Workspace.Mcp.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~PackagedDistributionTests.ExtractedDistribution_"

      - name: Validate packaged ConPTY handoff from downloaded archive
        if: matrix.runtime == 'win-x64'
        env:
          OPENCODE_EXISTING_PACKAGE_ARCHIVE: ${{ github.workspace }}/artifacts/downloaded/${{ matrix.runtime }}/opencode-workspace-${{ env.RELEASE_VERSION }}-${{ matrix.runtime }}.${{ matrix.archive_kind }}
          OPENCODE_PACKAGE_TEST_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/native-package-validation/${{ matrix.runtime }}/conpty-handoff
          OPENCODE_PACKAGE_CONPTY_TEST_ASSET_ROOT: ${{ github.workspace }}/tests/OpenCode.Workspace.ConPtyTestChild/bin/Release/net10.0
        run: >-
          dotnet test tests/OpenCode.Workspace.Mcp.Tests/OpenCode.Workspace.Mcp.Tests.csproj
          -c Release --no-build
          --filter "Category=PackagedConPtyIntegration"

  release-artifacts:
    name: Attach Release Artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-metadata
      - integration-validation
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5

      - name: Download current-run package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opencode-workspace-${{ needs.release-metadata.outputs.version }}-*
          path: release-artifacts

      - name: Verify exact release asset inventory and checksums
        shell: pwsh
        run: |
          $version = "${{ needs.release-metadata.outputs.version }}"
          $expected = @(
            "opencode-workspace-$version-win-x64/opencode-workspace-$version-win-x64.zip",
            "opencode-workspace-$version-win-x64/opencode-workspace-$version-win-x64.zip.sha256",
            "opencode-workspace-$version-linux-x64/opencode-workspace-$version-linux-x64.tar.gz",
            "opencode-workspace-$version-linux-x64/opencode-workspace-$version-linux-x64.tar.gz.sha256",
            "opencode-workspace-$version-osx-arm64/opencode-workspace-$version-osx-arm64.tar.gz",
            "opencode-workspace-$version-osx-arm64/opencode-workspace-$version-osx-arm64.tar.gz.sha256"
          ) | Sort-Object
          $actual = Get-ChildItem -LiteralPath release-artifacts -File -Recurse |
            ForEach-Object { [IO.Path]::GetRelativePath((Resolve-Path release-artifacts), $_.FullName).Replace('\', '/') } |
            Sort-Object
          $difference = Compare-Object -ReferenceObject $expected -DifferenceObject $actual
          if ($difference) {
            throw "Release asset inventory mismatch:`n$($difference | Out-String)"
          }

          foreach ($archive in $actual | Where-Object { $_ -notlike '*.sha256' }) {
            $archivePath = Join-Path release-artifacts $archive
            $parts = (Get-Content -LiteralPath "$archivePath.sha256" -Raw).Trim().Split("  ", 2)
            if ($parts.Count -ne 2 -or $parts[1] -ne [IO.Path]::GetFileName($archivePath)) {
              throw "Checksum sidecar filename mismatch for '$archive'."
            }
            $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
            if ($parts[0] -ne $actualHash) {
              throw "Checksum mismatch for '$archive'."
            }
          }

      - name: Refuse to mutate an already published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $existingJson = gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" `
            --jq '.[] | select(.tag_name == "${{ github.ref_name }}")'
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect releases for '${{ github.ref_name }}'."
          }
          if ($existingJson) {
            $existing = $existingJson | ConvertFrom-Json
            if (@($existing).Count -ne 1) {
              throw "Found multiple releases for '${{ github.ref_name }}'."
            }
            if (-not $existing.draft) {
              throw "Release '${{ github.ref_name }}' is already published. Refusing to replace assets on a public release."
            }
          }

      - name: Stage draft release and assets
        id: stage-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenCode Stuff ${{ needs.release-metadata.outputs.version }}
          body_path: ${{ needs.release-metadata.outputs.release_notes_path }}
          draft: true
          prerelease: ${{ needs.release-metadata.outputs.is_prerelease }}
          make_latest: false
          fail_on_unmatched_files: true
          preserve_order: true
          files: |
            release-artifacts/opencode-workspace-${{ needs.release-metadata.outputs.version }}-win-x64/opencode-workspace-${{ needs.release-metadata.outputs.version }}-win-x64.zip
            release-artifacts/opencode-workspace-${{ needs.release-metadata.outputs.version }}-win-x64/opencode-workspace-${{ needs.release-metadata.outputs.version }}-win-x64.zip.sha256
            release-artifacts/opencode-workspace-${{ needs.release-metadata.outputs.version }}-linux-x64/opencode-workspace-${{ needs.release-metadata.outputs.version }}-linux-x64.tar.gz
            release-artifacts/opencode-workspace-${{ needs.release-metadata.outputs.version }}-linux-x64/opencode-workspace-${{ needs.release-metadata.outputs.version }}-linux-x64.tar.gz.sha256
            release-artifacts/opencode-workspace-${{ needs.release-metadata.outputs.version }}-osx-arm64/opencode-workspace-${{ needs.release-metadata.outputs.version }}-osx-arm64.tar.gz
            release-artifacts/opencode-workspace-${{ needs.release-metadata.outputs.version }}-osx-arm64/opencode-workspace-${{ needs.release-metadata.outputs.version }}-osx-arm64.tar.gz.sha256

      - name: Verify staged GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ needs.release-metadata.outputs.version }}"
          $expected = @(
            "opencode-workspace-$version-win-x64.zip",
            "opencode-workspace-$version-win-x64.zip.sha256",
            "opencode-workspace-$version-linux-x64.tar.gz",
            "opencode-workspace-$version-linux-x64.tar.gz.sha256",
            "opencode-workspace-$version-osx-arm64.tar.gz",
            "opencode-workspace-$version-osx-arm64.tar.gz.sha256"
          ) | Sort-Object
          $actual = gh api "repos/${{ github.repository }}/releases/${{ steps.stage-release.outputs.id }}" --jq '.assets[].name' | Sort-Object
          $difference = Compare-Object -ReferenceObject $expected -DifferenceObject $actual
          if ($difference) {
            throw "Staged GitHub Release asset inventory mismatch:`n$($difference | Out-String)"
          }

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh api --method PATCH "repos/${{ github.repository }}/releases/${{ steps.stage-release.outputs.id }}" `
            -F "draft=false" `
            -F "prerelease=${{ needs.release-metadata.outputs.is_prerelease }}" `
            -f "make_latest=${{ needs.release-metadata.outputs.make_latest }}"
