---
name: CI

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "src/**"
      - "tests/**"
      - "catalog/**"
      - "build/**"
      - ".github/workflows/**"
      - "Directory.Packages.props"
      - "*.sln"
      - "*.slnx"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "catalog/**"
      - "build/**"
      - ".github/workflows/**"
      - "Directory.Packages.props"
      - "*.sln"
      - "*.slnx"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  desktop-ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows CI
            runs_on: windows-latest
            runtime: win-x64
            dist_dir: artifacts/dist/win-x64
            package_path: artifacts/dist/win-x64/opencode-workspace-ci-win-x64.zip
            artifact_name: opencode-workspace-win-x64
            executable_path: artifacts/dist/win-x64/opencode-workspace-ci-win-x64/OpenCode.Workspace.exe
            self_contained: true
            package_kind: zip
            platform_test_project: tests/OpenCode.Workspace.Platform.Windows.Tests/OpenCode.Workspace.Platform.Windows.Tests.csproj
          - name: Linux CI
            runs_on: ubuntu-latest
            runtime: linux-x64
            dist_dir: artifacts/dist/linux-x64
            package_path: artifacts/dist/opencode-workspace-linux-x64.tar.gz
            artifact_name: opencode-workspace-linux-x64
            executable_path: artifacts/dist/linux-x64/opencode-workspace-ci-linux-x64/OpenCode.Workspace
            self_contained: false
            package_kind: tar.gz
            platform_test_project: tests/OpenCode.Workspace.Platform.Linux.Tests/OpenCode.Workspace.Platform.Linux.Tests.csproj
          - name: macOS CI
            runs_on: macos-latest
            runtime: osx-arm64
            dist_dir: artifacts/dist/osx-arm64
            package_path: artifacts/dist/opencode-workspace-osx-arm64.tar.gz
            artifact_name: opencode-workspace-osx-arm64
            executable_path: artifacts/dist/osx-arm64/opencode-workspace-ci-osx-arm64/OpenCode.Workspace
            self_contained: false
            package_kind: tar.gz
            platform_test_project: tests/OpenCode.Workspace.Platform.MacOS.Tests/OpenCode.Workspace.Platform.MacOS.Tests.csproj
    env:
      DOTNET_NOLOGO: true
      EnableWindowsTargeting: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.204

      - name: Restore solution
        run: dotnet restore OpenCode.Workspace.slnx

      - name: Build solution
        run: dotnet build OpenCode.Workspace.slnx -c Release --no-restore

      - name: Run Core tests
        run: dotnet test tests/OpenCode.Workspace.Core.Tests/OpenCode.Workspace.Core.Tests.csproj -c Release --no-build -m:1

      - name: Run Avalonia tests
        run: dotnet test tests/OpenCode.Workspace.Avalonia.Tests/OpenCode.Workspace.Avalonia.Tests.csproj -c Release --no-build

      - name: Run platform tests
        run: dotnet test ${{ matrix.platform_test_project }} -c Release --no-build

      - name: Publish all local hosts
        run: >-
          dotnet publish src/OpenCode.Workspace.Avalonia/OpenCode.Workspace.Avalonia.csproj
          -c Release
          -r ${{ matrix.runtime }}
          --self-contained ${{ matrix.self_contained }}
          -p:DebugSymbols=false
          -p:DebugType=None
          -o artifacts/publish/${{ matrix.runtime }}/desktop

      - name: Publish CLI
        run: >-
          dotnet publish src/OpenCode.Workspace.Cli/OpenCode.Workspace.Cli.csproj
          -c Release
          -r ${{ matrix.runtime }}
          --self-contained ${{ matrix.self_contained }}
          -p:DebugSymbols=false
          -p:DebugType=None
          -o artifacts/publish/${{ matrix.runtime }}/cli

      - name: Publish API
        run: >-
          dotnet publish src/OpenCode.Workspace.Api/OpenCode.Workspace.Api.csproj
          -c Release
          -r ${{ matrix.runtime }}
          --self-contained ${{ matrix.self_contained }}
          -p:DebugSymbols=false
          -p:DebugType=None
          -o artifacts/publish/${{ matrix.runtime }}/api

      - name: Publish MCP
        run: >-
          dotnet publish src/OpenCode.Workspace.Mcp/OpenCode.Workspace.Mcp.csproj
          -c Release
          -r ${{ matrix.runtime }}
          --self-contained ${{ matrix.self_contained }}
          -p:DebugSymbols=false
          -p:DebugType=None
          -o artifacts/publish/${{ matrix.runtime }}/mcp

      - name: Assemble distribution
        run: >-
          dotnet run --project tools/OpenCode.Workspace.ReleaseTool/OpenCode.Workspace.ReleaseTool.csproj --
          assemble
          --source-root .
          --output-root ${{ matrix.dist_dir }}
          --runtime ${{ matrix.runtime }}
          --version ci
          --desktop-publish-dir artifacts/publish/${{ matrix.runtime }}/desktop
          --cli-publish-dir artifacts/publish/${{ matrix.runtime }}/cli
          --api-publish-dir artifacts/publish/${{ matrix.runtime }}/api
          --mcp-publish-dir artifacts/publish/${{ matrix.runtime }}/mcp
          --create-zip ${{ matrix.package_kind == 'zip' }}

      - name: Verify publish output on Windows
        if: matrix.package_kind == 'zip'
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ matrix.executable_path }}")) {
            throw "Packaged desktop executable missing: ${{ matrix.executable_path }}"
          }

          if (-not (Test-Path "artifacts/dist/win-x64/opencode-workspace-ci-win-x64/bin/local-host/OpenCode.Workspace.LocalHost.exe")) {
            throw "Packaged LocalHost executable missing."
          }

          if (-not (Test-Path "artifacts/dist/win-x64/opencode-workspace-ci-win-x64/bin/cli/OpenCode.Workspace.Cli.exe")) {
            throw "Packaged CLI executable missing."
          }

          if (-not (Test-Path "artifacts/dist/win-x64/opencode-workspace-ci-win-x64/bin/mcp/OpenCode.Workspace.Mcp.exe")) {
            throw "Packaged MCP executable missing."
          }

          if (Test-Path "artifacts/dist/win-x64/opencode-workspace-ci-win-x64/bin/api") {
            throw "Deprecated bin/api directory must not be packaged."
          }

          foreach ($hostDirectory in @(
            "artifacts/dist/win-x64/opencode-workspace-ci-win-x64",
            "artifacts/dist/win-x64/opencode-workspace-ci-win-x64/bin/local-host",
            "artifacts/dist/win-x64/opencode-workspace-ci-win-x64/bin/cli",
            "artifacts/dist/win-x64/opencode-workspace-ci-win-x64/bin/mcp")) {
            if (-not (Test-Path (Join-Path $hostDirectory "hostfxr.dll"))) {
              throw "Self-contained runtime file missing from $hostDirectory."
            }
          }

      - name: Verify publish output on Unix
        if: matrix.package_kind == 'tar.gz'
        shell: bash
        run: |
          test -f "${{ matrix.executable_path }}"
          test -f "artifacts/dist/${{ matrix.runtime }}/opencode-workspace-ci-${{ matrix.runtime }}/bin/mcp/OpenCode.Workspace.Mcp"

      - name: Package Unix artifact
        if: matrix.package_kind == 'tar.gz'
        shell: bash
        run: |
          tar -C "${{ matrix.dist_dir }}" -czf "${{ matrix.package_path }}" "opencode-workspace-ci-${{ matrix.runtime }}"

      - name: Write package checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "${{ matrix.package_path }}").Hash.ToLowerInvariant()
          Set-Content -LiteralPath "${{ matrix.package_path }}.sha256" -Value ("{0}  {1}" -f $hash, [System.IO.Path]::GetFileName("${{ matrix.package_path }}")) -NoNewline

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.package_path }}
            ${{ matrix.package_path }}.sha256

  release-artifacts:
    name: Attach Release Artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: desktop-ci
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release metadata
        id: release-metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "name=OpenCode Stuff $version"
            echo "body<<EOF"
            echo "Cross-platform Avalonia desktop release."
            echo
            echo "Includes:"
            echo "- Windows desktop package"
            echo "- Linux desktop package"
            echo "- macOS desktop package"
            echo "- Shared workspace, diagnostics, and platform integrations"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release-metadata.outputs.name }}
          body: ${{ steps.release-metadata.outputs.body }}
          files: |
            release-artifacts/opencode-workspace-win-x64/opencode-workspace-win-x64.zip
            release-artifacts/opencode-workspace-win-x64/opencode-workspace-win-x64.zip.sha256
            release-artifacts/opencode-workspace-linux-x64/opencode-workspace-linux-x64.tar.gz
            release-artifacts/opencode-workspace-linux-x64/opencode-workspace-linux-x64.tar.gz.sha256
            release-artifacts/opencode-workspace-osx-arm64/opencode-workspace-osx-arm64.tar.gz
            release-artifacts/opencode-workspace-osx-arm64/opencode-workspace-osx-arm64.tar.gz.sha256
