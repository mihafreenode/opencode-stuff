---
name: CI

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Only run CI when source, tests, build inputs, or workflow files change.
    paths:
      - "src/**"
      - "tests/**"
      - "catalog/**"
      - "build/**"
      - ".github/workflows/**"
      - "Directory.Packages.props"
      - "*.sln"
      - "*.slnx"
  pull_request:
    # Match push filtering so PR validation stays focused and cheap.
    paths:
      - "src/**"
      - "tests/**"
      - "catalog/**"
      - "build/**"
      - ".github/workflows/**"
      - "Directory.Packages.props"
      - "*.sln"
      - "*.slnx"

# Cancel older runs on the same branch so stale commits stop consuming minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux-validation:
    name: Linux Validation
    # Fast portable validation runs first and gates the Windows job.
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      # Allow Linux restore/build even though the solution
      # includes a Windows app.
      EnableWindowsTargeting: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.204

      - name: Restore
        run: dotnet restore OpenCode.Workspace.Manager.slnx

      - name: Build
        run: >-
          dotnet build OpenCode.Workspace.Manager.slnx
          -c Release
          --no-restore

      - name: Run portable/core tests
        working-directory: tests/OpenCode.Workspace.Core.Tests
        shell: bash
        run: |
          dotnet test \
            OpenCode.Workspace.Core.Tests.csproj \
            -c Release \
            --no-build

  windows-build:
    name: Windows Build
    # Only spend Windows minutes after Linux validation has passed.
    needs: linux-validation
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
    # Future stage: add MSIX packaging after launcher output is validated.
    # Future stage: add code signing once certificate handling is decided.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.204

      - name: Restore
        run: dotnet restore OpenCode.Workspace.Manager.slnx

      - name: Build
        run: >-
          dotnet build OpenCode.Workspace.Manager.slnx
          -c Release
          --no-restore

      - name: Run Windows tests
        shell: pwsh
        timeout-minutes: 10
        run: |
          dotnet test `
            tests/OpenCode.Workspace.Windows.Tests/OpenCode.Workspace.Windows.Tests.csproj `
            -c Release `
            --no-build `
            --logger "console;verbosity=detailed" `
            --blame-hang `
            --blame-hang-timeout 2m `
            --blame-hang-dump-type mini

      - name: Publish launcher
        shell: pwsh
        run: |
          dotnet publish `
            src/OpenCode.Workspace.Manager/OpenCode.Workspace.Manager.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o artifacts/win-x64

      - name: Package published launcher
        shell: pwsh
        run: |
          # Ship a simple downloadable archive until MSIX packaging is added.
          Compress-Archive `
            -Path artifacts/win-x64/* `
            -DestinationPath artifacts/opencode-stuff-win-x64.zip `
            -Force

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencode-stuff-win-x64
          path: artifacts/opencode-stuff-win-x64.zip

      - name: Prepare release metadata
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: release-metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "name=OpenCode Stuff $version"
            echo "body<<EOF"
            echo "Initial public release."
            echo
            echo "Includes:"
            echo "- Workspace Launcher"
            echo "- Ubuntu (WSL2) integration"
            echo "- Docker workspace support"
            echo "- Workspace catalog support"
            echo "- Terminal integration"
            echo "- Documentation and setup guides"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attach zip to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release-metadata.outputs.name }}
          body: ${{ steps.release-metadata.outputs.body }}
          files: artifacts/opencode-stuff-win-x64.zip
