# Built-in service manifest: oracle-ords

id: oracle-ords
displayName: Oracle ORDS
description: Oracle REST Data Services for local Oracle APEX onboarding.
image: container-registry.oracle.com/database/ords:latest
profiles:
  - oracle-ords
hostPorts:
  - ${ORACLE_ORDS_PORT}:8080
environment:
  ORACLE_PWD: ${ORACLE_PASSWORD}
  DBHOST: oracle-demo
  DBPORT: 1521
  DBSERVICENAME: FREEPDB1
restart: unless-stopped
dependsOn:
  - oracle-demo
healthcheck:
  test:
    - CMD-SHELL
    - curl -fsSL http://localhost:8080/ords >/dev/null || exit 1
  interval: 30s
  timeout: 10s
  retries: 10
  startPeriod: 5m
