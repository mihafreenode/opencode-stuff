# Built-in service manifest: oracle-ords

id: oracle-ords
displayName: Oracle ORDS
description: Oracle REST Data Services for local Oracle APEX onboarding.
image: container-registry.oracle.com/database/ords:latest
profiles:
  - oracle-ords
hostPorts:
  - ${ORACLE_ORDS_PORT}:8181
environment:
  ORDS_PUBLIC_USER_PASSWORD: ${ORACLE_PASSWORD}
  DB_HOSTNAME: oracle-demo
  DB_PORT: 1521
  DB_SERVICE: FREEPDB1
restart: unless-stopped
dependsOn:
  - oracle-demo
healthcheck:
  test:
    - CMD-SHELL
    - curl -fsSL http://localhost:8181/ords >/dev/null || exit 1
  interval: 30s
  timeout: 10s
  retries: 10
  startPeriod: 5m
