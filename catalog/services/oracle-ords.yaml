# Built-in service manifest: oracle-ords

id: oracle-ords
displayName: Oracle ORDS
description: Oracle REST Data Services for local Oracle APEX onboarding.
image: container-registry.oracle.com/database/ords:latest
profiles:
  - oracle-ords
hostPorts:
  - ${ORACLE_ORDS_PORT}:8080
volumes:
  - oracle-ords-config:/etc/ords/config
  - ${WORKSPACE_CONFIG_DOCKER_PATH}/ords:/opt/opencode-workspace/ords:ro
entrypoint:
  - bash
  - -lc
command:
  - bash /opt/opencode-workspace/ords/init-ords-config.sh
environment:
  ORACLE_ADMIN_USER: ${ORACLE_ADMIN_USER}
  ORACLE_PASSWORD: ${ORACLE_PASSWORD}
  ORACLE_HOST: ${ORACLE_HOST}
  ORACLE_PORT: ${ORACLE_PORT}
  ORACLE_SERVICE_NAME: ${ORACLE_SERVICE_NAME}
  ORACLE_ORDS_PUBLIC_USER: ${ORACLE_ORDS_PUBLIC_USER}
  ORACLE_ORDS_PUBLIC_PASSWORD: ${ORACLE_ORDS_PUBLIC_PASSWORD}
restart: unless-stopped
dependsOn:
  - oracle-demo
healthcheck:
  test:
    - CMD-SHELL
    - curl -fsSI http://localhost:8080/ords/_/landing >/dev/null || exit 1
  interval: 30s
  timeout: 10s
  retries: 10
  startPeriod: 5m
