# Built-in service manifest: oracle-demo

id: oracle-demo
displayName: Oracle Free Demo Database
description: Oracle Database Free service for fully local PL/SQL onboarding and demonstration.
image: gvenzl/oracle-free:23
profiles:
  - oracle-demo
hostPorts:
  - ${ORACLE_HOST_PORT}:1521
environment:
  ORACLE_PASSWORD: ${ORACLE_PASSWORD}
restart: unless-stopped
workspaceDependsOnCondition: service_healthy
healthcheck:
  test:
    - CMD-SHELL
    - healthcheck.sh
  interval: 30s
  timeout: 10s
  retries: 10
  startPeriod: 5m
volumes:
  - oracle-demo-data:/opt/oracle/oradata
  - ${WORKSPACE_TUTORIAL_DOCKER_PATH}/oracle/init:/container-entrypoint-initdb.d
