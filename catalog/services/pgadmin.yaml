# Built-in service manifest: pgadmin

id: pgadmin
displayName: pgAdmin
description: pgAdmin web UI that pairs with the built-in PostgreSQL service.
image: dpage/pgadmin4:9
hostPorts:
  - ${PGADMIN_PORT}:80
environment:
  PGADMIN_DEFAULT_EMAIL: admin@example.com
  PGADMIN_DEFAULT_PASSWORD: admin
dependsOn:
  - postgres
