# Built-in feature manifest: document-processing

id: document-processing
displayName: Document Processing
description: End-to-end tooling for report generation, PDF conversion, diagrams, validation, and Windows-compatible document fonts.
capabilities:
  - documentation
  - document-processing
  - analytics
  - reporting
  - testing
dependencies:
  apt:
    - pandoc
    - libreoffice-writer
    - graphviz
    - plantuml
    - imagemagick
    - poppler-utils
    - ghostscript
    - qpdf
    - fonts-dejavu
    - fonts-liberation
    - fonts-crosextra-carlito
    - fonts-crosextra-caladea
    - fonts-noto
    - fonts-noto-cjk
    - fonts-noto-extra
    - fonts-noto-color-emoji
    - fonts-roboto
    - fonts-inter
    - fonts-firacode
    - fonts-jetbrains-mono
  npm:
    - playwright
    - '@mermaid-js/mermaid-cli'
  pip:
    - weasyprint
    - markdown-it-py
    - pypdf
    - pymupdf
    - reportlab
postInstall:
  - |
    if command -v typst >/dev/null 2>&1; then
      typst --version
    elif apt-cache policy typst | grep -F "Candidate:" | grep -Fvq "(none)"; then
      opencode_apt_install_optional typst
    else
      case "$(uname -m)" in
        x86_64) typst_asset=typst-x86_64-unknown-linux-musl.tar.xz ;;
        aarch64|arm64) typst_asset=typst-aarch64-unknown-linux-musl.tar.xz ;;
        *) echo "[document-processing] Unsupported architecture for automatic Typst install: $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL "https://github.com/typst/typst/releases/latest/download/${typst_asset}" -o /tmp/typst.tar.xz
      rm -rf /tmp/typst-install
      mkdir -p /tmp/typst-install
      tar -xJf /tmp/typst.tar.xz -C /tmp/typst-install
      install /tmp/typst-install/typst-*/typst /usr/local/bin/typst
      rm -rf /tmp/typst.tar.xz /tmp/typst-install
    fi
  - |
    if apt-cache policy ttf-mscorefonts-installer | grep -F "Candidate:" | grep -Fvq "(none)"; then
      echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | debconf-set-selections
      opencode_apt_install_optional ttf-mscorefonts-installer
    else
      echo "[document-processing] ttf-mscorefonts-installer is unavailable for this Ubuntu image. Skipping Microsoft-compatible core fonts."
    fi
  - |
    playwright_browsers_path=/ms-playwright
    opencode_ensure_dir_owned_if_user_exists "${playwright_browsers_path}"
    echo "[document-processing] Playwright browser cache: ${playwright_browsers_path}"
    opencode_run_as_opencode_or_root 'export PLAYWRIGHT_BROWSERS_PATH=/ms-playwright; playwright install chromium'
  - |
    playwright_global_root=$(npm root -g)
    export PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    echo "[document-processing] Global Playwright module root: ${playwright_global_root}"
    playwright_chromium_path=$(opencode_run_as_opencode_or_root 'export PLAYWRIGHT_BROWSERS_PATH=/ms-playwright; export NODE_PATH=$(npm root -g); node -e "const { chromium } = require(process.env.NODE_PATH + \"/playwright\"); process.stdout.write(chromium.executablePath());"')
    if [ -n "${playwright_chromium_path}" ] && [ -x "${playwright_chromium_path}" ]; then
      echo "[document-processing] Resolved Playwright Chromium executable: ${playwright_chromium_path}"
      ln -sf "${playwright_chromium_path}" /usr/local/bin/chromium
    else
      echo "[document-processing] Playwright Chromium executable could not be resolved after installation." >&2
      exit 1
    fi
  - |
    mkdir -p /var/cache/fontconfig
    fc-cache -fv || {
      rm -rf /var/cache/fontconfig/*
      fc-cache -fv
    }
