# Built-in feature manifest: publishing-tex

id: publishing-tex
displayName: Publishing & TeX
description: Reproducible document publishing with Markdown, Typst, LaTeX, citations, SVG workflows, and PDF validation.
category: runtime
lifecycle: preview
recommends:
  - publishing-knowledge-pack
capabilities:
  - reporting
  - documentation
dependencies:
  apt:
    - biber
    - ghostscript
    - graphviz
    - inkscape
    - latexmk
    - librsvg2-bin
    - pandoc
    - poppler-utils
    - qpdf
    - texlive-fonts-recommended
    - texlive-latex-extra
    - texlive-latex-recommended
    - texlive-science
postInstall:
  - |
    if command -v typst >/dev/null 2>&1; then
      typst --version
    elif apt-cache policy typst | grep -F "Candidate:" | grep -Fvq "(none)"; then
      apt-get install -y typst
    else
      case "$(uname -m)" in
        x86_64) typst_asset=typst-x86_64-unknown-linux-musl.tar.xz ;;
        aarch64|arm64) typst_asset=typst-aarch64-unknown-linux-musl.tar.xz ;;
        *) echo "[document-processing] Unsupported architecture for automatic Typst install: $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL "https://github.com/typst/typst/releases/latest/download/${typst_asset}" -o /tmp/typst.tar.xz
      rm -rf /tmp/typst-install
      mkdir -p /tmp/typst-install
      tar -xJf /tmp/typst.tar.xz -C /tmp/typst-install
      install /tmp/typst-install/typst-*/typst /usr/local/bin/typst
      rm -rf /tmp/typst.tar.xz /tmp/typst-install
    fi
