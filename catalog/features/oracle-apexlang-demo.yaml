# Built-in feature manifest: oracle-apexlang-demo

id: oracle-apexlang-demo
displayName: Oracle APEXlang Demo Assets
description: Source-controlled Oracle APEXlang export and import scripts, onboarding docs, and repository workflow helpers.
category: runtime
lifecycle: stable
alwaysEnabled: false
knowledgePacks:
  - oracle-apex-documentation-pack
  - oracle-ords-documentation-pack
  - oracle-apexlang-documentation-pack
  - oracle-apex-developers-companion-pack
capabilities:
  - oracle
dependencies:
  apt:
    - curl
    - jq
postInstall:
  - 'mkdir -p /workspace/apex /workspace/docs /workspace/scripts /workspace/sql'
